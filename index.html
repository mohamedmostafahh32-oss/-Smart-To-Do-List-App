<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة المهام اليومية الذكية | Smart To-Do List</title>
  <meta name="description" content="قائمة المهام اليومية الذكية - تطبيق متطور لإدارة المهام بذكاء وسهولة." />
  <meta name="theme-color" content="#6c5ce7" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="src/assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="src/css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="src/assets/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>
  <div class="background">
    <div class="background__particles"></div>
    <div class="background__glow"></div>
  </div>
  <main class="main">
    <header class="header">
      <div class="container">
        <div class="header__logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0-.33-1.82l-2.5-3a1.65 1.65 0 0 0-1.34-.55l-.33.01a1.65 1.65 0 0 0-1.34-.55l-.33.01"></path><path d="M2 17h20"></path><path d="M12 2v13.55a4 4 0 0 0-4 4V17"></path></svg>
          <h1>قائمة المهام <span class="text-primary">الذكية</span></h1>
        </div>
        <div class="header__nav">
          <button class="btn btn--icon" id="settingsBtn" aria-label="الإعدادات">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0-.33-1.82l-2.5-3a1.65 1.65 0 0 0-1.34-.55l-.33.01a1.65 1.65 0 0 0-1.34-.55l-.33.01a1.65 1.65 0 0 0-1.33.55l-2.5 3a1.65 1.65 0 0 0-.33 1.82v.78a1.65 1.65 0 0 0 .33 1.82l2.5 3a1.65 1.65 0 0 0 1.34.55l.33-.01a1.65 1.65 0 0 0 1.34.55l.33-.01a1.65 1.65 0 0 0 1.33-.55l2.5-3a1.65 1.65 0 0 0 .33-1.82v-.78Z"></path></svg>
          </button>
        </div>
      </div>
    </header>
    <section class="section">
      <div class="container">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__icon"><svg width="24" height="24" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div class="stat-card__content"><p class="stat-card__label">المهام المكتملة</p><h3 class="stat-card__value" id="completedCount">0</h3></div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon"><svg width="24" height="24" stroke="currentColor"><path d="M19.4 15a1.65 1.65 0 0 0-.33-1.82l-2.5-3a1.65 1.65 0 0 0-1.34-.55l-.33.01a1.65 1.65 0 0 0-1.34-.55l-.33.01a1.65 1.65 0 0 0-1.33.55l-2.5 3a1.65 1.65 0 0 0-.33 1.82v.78a1.65 1.65 0 0 0 .33 1.82l2.5 3a1.65 1.65 0 0 0 1.34.55l.33-.01a1.65 1.65 0 0 0 1.34.55l.33-.01a1.65 1.65 0 0 0 1.33-.55l2.5-3a1.65 1.65 0 0 0 .33-1.82v-.78Z"></path></svg></div>
            <div class="stat-card__content"><p class="stat-card__label">المهام النشطة</p><h3 class="stat-card__value" id="activeCount">0</h3></div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon"><svg width="24" height="24" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="12" x2="21" y2="12"></line></svg></div>
            <div class="stat-card__content"><p class="stat-card__label">المهام اليوم</p><h3 class="stat-card__value" id="todayCount">0</h3></div>
          </div>
        </div>
      </div>
    </section>    
    <!-- ===== Add Task Section ===== -->
    <section class="section section--alt">
      <div class="container">
        <h2 class="section__title">إضافة مهمة جديدة</h2>
        <form id="taskForm" class="task-form">
          <div class="form-group">
            <input type="text" id="taskTitle" class="input" placeholder="اكتب اسم المهمة هنا..." required />
          </div>
          <div class="form-group">
            <select id="taskPriority" class="select">
              <option value="" disabled selected>حدد الأولوية</option>
              <option value="high">عالية</option>
              <option value="medium">متوسطة</option>
              <option value="low">منخفضة</option>
            </select>
          </div>
          <div class="form-group">
            <input type="date" id="taskDueDate" class="input-date" />
          </div>
          <button type="submit" class="btn btn--primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
            إضافة المهمة
          </button>
        </form>
      </div>
    </section>
    <!-- ===== Tasks List ===== -->
    <section class="section">
      <div class="container">
        <h2 class="section__title">مهامك اليوم</h2>
        <div class="tasks-filters">
          <button class="btn btn--ghost filter-btn active" data-filter="all">الكل</button>
          <button class="btn btn--ghost filter-btn" data-filter="active">نشطة</button>
          <button class="btn btn--ghost filter-btn" data-filter="completed">مكتملة</button>
        </div>
        <div class="tasks-list" id="tasksList"></div>
        <div class="empty-state" id="emptyState">
          <div class="empty-state__icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l2 2 4-4"></path>
              <path d="M12 22c5.523 0 10-4.477 10-10V5l-4-4H6L2 5v12c0 5.523 4.477 10 10 10z"></path>
            </svg>
          </div>
          <h3 class="empty-state__title">لا توجد مهام بعد</h3>
          <p class="empty-state__text">أضف مهمة جديدة للبدء</p>
        </div>
      </div>
    </section>
  </main>
  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <p class="footer__text">&copy; 2024 قائمة المهام الذكية. جميع الحقوق محفوظة.</p>
    </div>
  </footer>
  <!-- ===== Settings Modal ===== -->
  <div class="modal" id="settingsModal">
    <div class="modal__overlay" aria-hidden="true"></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">الإعدادات</h2>
      <div class="modal__body">
        <div class="setting-group">
          <h3>إشعارات التواعدات</h3>
          <div class="setting-item">
            <label class="switch">
              <input type="checkbox" id="reminderToggle" checked />
              <span class="switch__track"></span>
              <span class="switch__thumb"></span>
            </label>
            <span class="setting-item__label">تفعيل التواعدات</span>
          </div>
        </div>
        <div class="setting-group">
          <h3>وضع الليل</h3>
          <div class="setting-item">
            <label class="switch">
              <input type="checkbox" id="darkModeToggle" />
              <span class="switch__track"></span>
              <span class="switch__thumb"></span>
            </label>
            <span class="setting-item__label">تفعيل الوضع الداكن</span>
          </div>
        </div>
        <div class="setting-group">
          <h3>لغة التطبيق</h3>
          <select id="languageSelect" class="select">
            <option value="ar" selected>العربية</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="closeSettings">إلغاء</button>
        <button class="btn btn--primary" id="saveSettings">حفظ الإعدادات</button>
      </div>
    </div>
  </div>
  <script src="src/js/app.js"></script>
</body>
</html>
