<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a48c9;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <circle cx="256" cy="256" r="180" fill="white" fill-opacity="0.95" filter="url(#shadow)"/>
  
  <!-- Check Mark Icon -->
  <circle cx="256" cy="256" r="120" fill="#7c3aed" opacity="0.1"/>
  
  <!-- Main Check Icon -->
  <path d="M 180 256 L 235 310 L 345 200" 
        stroke="#7c3aed" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>
  
  <!-- Decorative List Dots -->
  <circle cx="256" cy="140" r="8" fill="#6c5ce7"/>
  <circle cx="256" cy="180" r="8" fill="#6c5ce7" opacity="0.7"/>
  <circle cx="256" cy="220" r="8" fill="#6c5ce7" opacity="0.4"/>
  
  <!-- Decorative Lines -->
  <line x1="200" y1="140" x2="312" y2="140" stroke="#6c5ce7" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="200" y1="180" x2="312" y2="180" stroke="#6c5ce7" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  <line x1="200" y1="220" x2="312" y2="220" stroke="#6c5ce7" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
</svg>